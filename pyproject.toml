[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sutra-engine"
version = "0.1.2"
description = "Code-aware retrieval engine with a guided CLI for indexing, serving, and querying repositories."
authors = [
    {name="Ritik Shukla", email="shukla.ritik2001@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license-files = ["LICENCE"]
dependencies = [
    # --- Core runtime (kept in sync with requirements.txt) ---
    "fastapi==0.136.3",
    "uvicorn==0.35.0",
    "mcp==1.27.2",
    "openai==2.30.0",
    "psycopg2-binary",
    "pydantic==2.12.5",
    "PyYAML==6.0.3",
    "numpy==2.4.4",
    "GitPython==3.1.46",
    "pygit2==1.19.2",
    "rustworkx==0.17.1",
    "rank-bm25==0.2.2",
    "tree-sitter==0.25.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
    # --- CLI (sutra init wizard) ---
    "typer>=0.20,<0.26",
    "rich==13.9.4",
    "questionary==2.1.0",
    # Pin below 3.0.52: questionary 2.1.0's cosmetic layout hack crashes on 3.0.52+.
    "prompt_toolkit>=3.0,<3.0.52",
]

[project.optional-dependencies]
local = ["sentence-transformers==5.5.1"]

[project.scripts]
sutra = "sutra.cli.main:app"

[project.urls]
Homepage = "https://github.com/ritikk112/sutra"
Issues = "https://github.com/ritikk112/sutra/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sutra*", "pipelines*", "frontend*"]

[tool.setuptools.package-data]
"sutra.core.queries" = ["*.scm"]
"sutra.core.graph.migrations" = ["*.sql"]
"sutra.core.retrieval.lexicons" = ["*.yaml"]